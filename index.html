<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pill Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .camera-container {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            position: relative;
        }

        #video {
            width: 100%;
            display: block;
            background: #000;
        }

        .camera-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 60%;
            border: 3px dashed rgba(255,255,255,0.5);
            border-radius: 10px;
            pointer-events: none;
        }

        .overlay-text {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
        }

        .status-panel {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .status-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            margin-bottom: 10px;
            background: #f5f5f5;
            border-radius: 10px;
            font-size: 16px;
        }

        .status-item:last-child {
            margin-bottom: 0;
        }

        .status-label {
            font-weight: 600;
            color: #333;
        }

        .status-value {
            font-weight: 500;
        }

        .status-value.positive {
            color: #10b981;
        }

        .status-value.negative {
            color: #ef4444;
        }

        .status-value.neutral {
            color: #6b7280;
        }

        .medication-text {
            background: #f0f9ff;
            border: 2px solid #3b82f6;
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 14px;
            color: #1e40af;
            max-height: 100px;
            overflow-y: auto;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 18px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #startBtn {
            background: #10b981;
            color: white;
        }

        #startBtn:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        #startBtn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        #stopBtn {
            background: #ef4444;
            color: white;
            display: none;
        }

        #stopBtn:hover {
            background: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .timer {
            text-align: center;
            color: white;
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .timer.warning {
            color: #fbbf24;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            .header h1 {
                font-size: 24px;
            }

            .status-item {
                font-size: 14px;
                padding: 12px;
            }

            button {
                padding: 15px;
                font-size: 16px;
            }

            .timer {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💊 Pill Verification</h1>
            <p>Verify medication compliance in real-time</p>
        </div>

        <div class="timer hidden" id="timer">30</div>

        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <div class="camera-overlay"></div>
            <div class="overlay-text" id="overlayText">Position bottle in frame</div>
        </div>

        <div class="status-panel">
            <div class="status-item">
                <span class="status-label">Person Detected:</span>
                <span class="status-value neutral" id="personStatus">Waiting...</span>
            </div>
            <div class="status-item">
                <span class="status-label">Medication Visible:</span>
                <span class="status-value neutral" id="medicationStatus">Waiting...</span>
            </div>
            <div class="status-item">
                <span class="status-label">Pill Taken:</span>
                <span class="status-value neutral" id="pillStatus">Waiting...</span>
            </div>
            <div class="medication-text hidden" id="medicationText"></div>
        </div>

        <div class="controls">
            <button id="startBtn">Start Monitoring (30s)</button>
            <button id="stopBtn">Stop</button>
        </div>
    </div>

    <script>
        // Configuration
        const API_URL = 'https://pill-verification.onrender.com';  // Your deployed API
        const MONITORING_DURATION = 30000; // 30 seconds
        const FRAME_INTERVAL = 500; // Process frame every 500ms

        // Elements
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const timer = document.getElementById('timer');
        const overlayText = document.getElementById('overlayText');
        const personStatus = document.getElementById('personStatus');
        const medicationStatus = document.getElementById('medicationStatus');
        const pillStatus = document.getElementById('pillStatus');
        const medicationText = document.getElementById('medicationText');

        // State
        let monitoring = false;
        let monitoringInterval;
        let monitoringTimeout;
        let stream;
        let timeRemaining = 30;

        // Start camera
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'user',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });
                video.srcObject = stream;
                overlayText.textContent = 'Camera ready! Click "Start Monitoring"';
            } catch (err) {
                alert('Camera access denied. Please allow camera access and refresh.');
                console.error('Camera error:', err);
            }
        }

        // Capture and process frame
        async function processFrame() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);

            // Convert to blob
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('file', blob, 'frame.jpg');

                try {
                    const response = await fetch(`${API_URL}/process_frames`, {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error(`API error: ${response.status}`);
                    }

                    const data = await response.json();
                    updateUI(data);
                } catch (err) {
                    console.error('Processing error:', err);
                    overlayText.textContent = 'Error connecting to server';
                }
            }, 'image/jpeg', 0.8);
        }

        // Update UI with results
        function updateUI(data) {
            // Person detected
            if (data.pose.person_detected) {
                personStatus.textContent = '✅ Yes';
                personStatus.className = 'status-value positive';
            } else {
                personStatus.textContent = '❌ No';
                personStatus.className = 'status-value negative';
            }

            // Medication visible
            if (data.ocr.medication_indicators) {
                medicationStatus.textContent = '✅ Detected';
                medicationStatus.className = 'status-value positive';
                medicationText.textContent = data.ocr.full_text || 'Text detected';
                medicationText.classList.remove('hidden');
            } else if (data.ocr.text_detected) {
                medicationStatus.textContent = '⚠️ Text found (not medication)';
                medicationStatus.className = 'status-value neutral';
                medicationText.textContent = data.ocr.full_text || 'Unknown text';
                medicationText.classList.remove('hidden');
            } else {
                medicationStatus.textContent = '❌ Not visible';
                medicationStatus.className = 'status-value negative';
                medicationText.classList.add('hidden');
            }

            // Pill taken
            if (data.pose.hand_to_mouth) {
                pillStatus.textContent = `✅ Yes (${Math.round(data.pose.confidence * 100)}% confident)`;
                pillStatus.className = 'status-value positive';
                overlayText.textContent = '✅ Pill-taking gesture detected!';
            } else if (data.pose.person_detected) {
                pillStatus.textContent = '⏳ Monitoring...';
                pillStatus.className = 'status-value neutral';
                overlayText.textContent = 'Raise hand to mouth to take pill';
            } else {
                pillStatus.textContent = '❌ No';
                pillStatus.className = 'status-value negative';
                overlayText.textContent = 'Position yourself in frame';
            }
        }

        // Start monitoring
        function startMonitoring() {
            monitoring = true;
            timeRemaining = 30;
            
            startBtn.style.display = 'none';
            stopBtn.style.display = 'block';
            timer.classList.remove('hidden');
            overlayText.textContent = 'Monitoring started...';

            // Process frames every 500ms
            monitoringInterval = setInterval(() => {
                if (monitoring) {
                    processFrame();
                }
            }, FRAME_INTERVAL);

            // Countdown timer
            const timerInterval = setInterval(() => {
                timeRemaining--;
                timer.textContent = timeRemaining;
                
                if (timeRemaining <= 10) {
                    timer.classList.add('warning');
                }

                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                }
            }, 1000);

            // Stop after 30 seconds
            monitoringTimeout = setTimeout(() => {
                stopMonitoring();
                alert('✅ Monitoring complete! Check the results above.');
            }, MONITORING_DURATION);
        }

        // Stop monitoring
        function stopMonitoring() {
            monitoring = false;
            clearInterval(monitoringInterval);
            clearTimeout(monitoringTimeout);
            
            startBtn.style.display = 'block';
            stopBtn.style.display = 'none';
            timer.classList.add('hidden');
            timer.classList.remove('warning');
            overlayText.textContent = 'Monitoring stopped';
        }

        // Event listeners
        startBtn.addEventListener('click', startMonitoring);
        stopBtn.addEventListener('click', stopMonitoring);

        // Initialize camera on load
        startCamera();
    </script>
</body>
</html>
